<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Blog Reader | VC Organic Farms</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link href="../../css/ampul.webflow.shared.aefc512af.css" rel="stylesheet" type="text/css"/>
<link href="../../css/brand-kit.css?v=1.30" rel="stylesheet" type="text/css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="../../js/animations.js?v=1.30"></script>
  <style>
    .w-webflow-badge { display: none !important; }
    .blog-details-description img { max-width: 100%; border-radius: 12px; margin: 20px 0; }
  </style>
</head>
<body style="background-color: #fbf9f6; font-family: 'DM Sans', sans-serif;">
  <div class="page-wrapper">
    <!-- Header Block (Copied from template index) -->
    <div class="header-milk-wave">
  <svg viewBox="0 0 1440 140" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" style="width: 100%; height: 100%; display: block;">
    <path d="M0,0 Q180,95 360,65 T720,85 T1080,55 T1440,75 L1440,0 L0,0 Z" fill="#FFFFFF"/>
    <path d="M0,0 Q180,80 360,50 T720,70 T1080,40 T1440,60 L1440,0 L0,0 Z" fill="rgba(250, 248, 244, 0.7)"/>
  </svg>
</div>
<div class="header-section w-nav" style="background-color: rgba(220, 230, 232, 0.45); backdrop-filter: blur(16px); position: fixed; width: 100%; z-index: 1000; top: 0;">
      <div class="container-default _1880 w-container">
        <div class="header-block" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 0;">
          <a href="../../index.html" class="header-brand w-inline-block" style="display: flex; align-items: center; text-decoration: none; gap: 10px;">
            <img src="../../img/logo icon.png" loading="eager" alt="" class="header-brand-logo" style="height: 40px;"/>
            <div class="brand-text-block" style="display: flex; flex-direction: column; line-height: 1;">
              <span class="brand-text-title" style="font-weight: 700; color: #0c2b1c; font-size: 16px;">VC ORGANIC</span>
              <span class="brand-text-subtitle" style="font-size: 10px; letter-spacing: 2px; color: #6b8473;">FARMS</span>
            </div>
          </a>
          <div class="header-menu">
            <nav role="navigation" class="header-menu-block w-nav-menu" style="display: flex; gap: 20px;">
              <a href="../../index.html" class="nav-link w-nav-link" style="color: #0c2b1c; text-decoration: none; font-weight: 500;">Home</a>
              <a href="../../about/index.html" class="nav-link w-nav-link" style="color: #0c2b1c; text-decoration: none; font-weight: 500;">About</a>
              <a href="../../products/index.html" class="nav-link w-nav-link" style="color: #0c2b1c; text-decoration: none; font-weight: 500;">Products</a>
              <a href="../../blog/index.html" class="nav-link w-nav-link active" style="color: #0c2b1c; text-decoration: none; font-weight: 700;">Blog</a>
            </nav>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Content Reader -->
    <div class="main-wrapper" style="padding-top: 140px; min-height: 80vh;">
      <section class="global-section">
        <div class="section-gap bottom-gap">
          <div class="w-layout-blockcontainer container-default w-container">
            <div class="blog-details-block" style="max-width: 800px; margin: 0 auto; background: white; padding: 40px; border-radius: 24px; box-shadow: 0 10px 30px rgba(12, 43, 28, 0.04);">
              <div class="section-info-block" style="margin-bottom: 20px;">
                <div class="section-info" style="display: flex; align-items: center; gap: 10px; font-size: 14px;">
                  <a href="../../index.html" class="section-info-text link" style="color: #6b8473; text-decoration: none;">Home</a>
                  <div class="section-info-line" style="width: 12px; height: 1px; background: #ccd5ce;"></div>
                  <a href="../../blog/index.html" class="section-info-text link" style="color: #6b8473; text-decoration: none;">Blog</a>
                  <div class="section-info-line" style="width: 12px; height: 1px; background: #ccd5ce;"></div>
                  <div id="blog-category" class="section-info-text active" style="color: #0c2b1c; font-weight: 600;">Category</div>
                </div>
              </div>
              <div class="blog-details-name-block">
                <h1 id="blog-title" class="blog-details-name" style="font-size: 36px; line-height: 1.2; color: #0c2b1c; font-weight: 700; margin: 10px 0 20px 0;">Loading Article...</h1>
              </div>
              <div class="blog-details-info-block" style="display: flex; gap: 15px; font-size: 14px; color: #6b8473; margin-bottom: 30px; border-bottom: 1px solid #f0eae4; padding-bottom: 15px;">
                <div id="blog-date" class="blog-info-text">Date</div>
                <div class="blog-info-text">•</div>
                <div id="blog-readtime" class="blog-info-text">Read Time</div>
                <div class="blog-info-text">•</div>
                <div id="blog-author" class="blog-info-text" style="color: #0c2b1c; font-weight: 600;">Author</div>
              </div>
              <div class="blog-details-image-block" style="text-align: center; margin: 30px 0;">
                <img id="blog-image" src="" alt="" class="blog-details-image" style="border-radius: 16px; max-height: 500px; width: 100%; object-fit: cover; box-shadow: 0 8px 24px rgba(0,0,0,0.06);"/>
              </div>
              <div class="blog-details-description-block" style="margin-top: 30px; line-height: 1.7; color: #2d3e35; font-size: 16px;">
                <div id="blog-content" class="blog-details-description w-richtext">
                  <!-- Dynamic Content Injected Here -->
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Recent Posts Section (Dynamic recommendation) -->
      <section class="blog-section" style="background-color: #faf6f0; padding: 60px 0; border-top: 1px solid #f0eae4; margin-top: 60px;">
        <div class="w-layout-blockcontainer container-default w-container" style="max-width: 800px; margin: 0 auto;">
          <h3 style="margin-bottom: 30px; color: #0c2b1c; font-size: 24px; font-weight: 700; text-align: center;">Read More Articles</h3>
          <div class="blog-post-block">
            <div class="blog-list-wrapper w-dyn-list">
              <div id="recent-posts-list" role="list" class="blog-list w-dyn-items" style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
                <!-- Injected via Script -->
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <!-- Footer Block (Simplified VC Organic Farms Footer) -->
    <section class="footer-section" style="background-color: #0c2b1c; color: #ccd5ce; padding: 40px 0; text-align: center; font-size: 14px;">
      <div class="w-layout-blockcontainer container-default w-container">
        <p>© 2026 VC Organic Farms. All rights reserved. Delivering raw milk purity direct to your doorstep.</p>
      </div>
    </section>
  </div>

  <script src="../../js/blog-data.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const params = new URLSearchParams(window.location.search);
      const postId = params.get('id') || 'benefits-of-a2-milk';
      
      const post = BLOG_POSTS.find(p => p.id === postId) || BLOG_POSTS[0];
      
      // Inject details
      document.title = post.title + " | VC Organic Farms";
      document.getElementById('blog-category').innerText = post.category;
      document.getElementById('blog-title').innerText = post.title;
      document.getElementById('blog-date').innerText = post.date;
      document.getElementById('blog-readtime').innerText = post.readTime;
      document.getElementById('blog-author').innerText = "By " + post.author;
      document.getElementById('blog-image').src = "../../img/" + post.image;
      document.getElementById('blog-content').innerHTML = post.content;

      // Populate other articles
      const otherPosts = BLOG_POSTS.filter(p => p.id !== post.id).slice(0, 2);
      const listEl = document.getElementById('recent-posts-list');
      listEl.innerHTML = '';
      
      otherPosts.forEach(op => {
        const itemHtml = `
          <div role="listitem" class="blog-item w-dyn-item" style="background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.02); border: 1px solid #f0eae4;">
            <a href="index.html?id=\${op.id}" class="blog-post w-inline-block" style="text-decoration: none; display: block; height: 100%;">
              <div class="blog-image-block" style="position: relative; height: 180px; overflow: hidden;">
                <img src="../../img/\${op.image}" alt="" class="blog-image" style="width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease;"/>
              </div>
              <div class="blog-content-card" style="padding: 20px;">
                <div class="blog-info" style="color: #6b8473; font-size: 12px; margin-bottom: 8px;">
                  \${op.date} • \${op.readTime}
                </div>
                <h6 class="blog-name" style="font-size: 16px; margin: 0; color: #0c2b1c; font-weight: 700; line-height: 1.3;">\${op.title}</h6>
              </div>
            </a>
          </div>
        `;
        listEl.insertAdjacentHTML('beforeend', itemHtml);
      });
    });
  </script>
</body>
</html>
